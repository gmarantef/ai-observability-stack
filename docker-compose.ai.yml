include:
  - docker-compose.exporters.yml

services:
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm
    restart: unless-stopped
    ports:
      - "8585:4000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OTEL_EXPORTER=otlp_http
      - OTEL_ENDPOINT=http://otelcol:4318
      - OTEL_SERVICE_NAME=litellm-proxy
    volumes:
      - ./assets/litellm-config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      otelcol:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - observability
      - inference

networks:
  inference:
    name: inference
    driver: bridge
