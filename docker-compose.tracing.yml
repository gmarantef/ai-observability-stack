services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.4.1
    container_name: clickhouse
    restart: unless-stopped
    environment:
      - CLICKHOUSE_PASSWORD=${OPENLIT_DB_PASSWORD}
      - CLICKHOUSE_USER=${OPENLIT_DB_USER}
      - CLICKHOUSE_DATABASE=${OPENLIT_DB_NAME}
      - CLICKHOUSE_ALWAYS_RUN_INITDB_SCRIPTS=true
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./assets/clickhouse-config.xml:/etc/clickhouse-server/config.d/custom-config.xml:ro
      - ./assets/clickhouse-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    expose:
      - 9000
      - 8123
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user=$${CLICKHOUSE_USER} --password=$${CLICKHOUSE_PASSWORD} --query='SELECT 1' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 100s
    networks:
      - tracing

  openlit:
    image: ghcr.io/openlit/openlit:latest
    container_name: openlit
    restart: unless-stopped
    environment:
      - TELEMETRY_ENABLED=false
      - INIT_DB_HOST=clickhouse
      - INIT_DB_PORT=8123
      - INIT_DB_DATABASE=${OPENLIT_DB_NAME}
      - INIT_DB_USERNAME=${OPENLIT_DB_USER}
      - INIT_DB_PASSWORD=${OPENLIT_DB_PASSWORD}
      - SQLITE_DATABASE_URL=file:/app/client/data/data.db
    ports:
      - "3002:3000"
      - "4317:4317"
      - "4318:4318"
    depends_on:
      clickhouse:
        condition: service_healthy
    volumes:
      - openlit_data:/app/client/data
      - ./assets/otel-collector-config.yaml:/etc/otel/otel-collector-config.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://openlit:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    networks:
      - tracing

volumes:
  clickhouse_data:
  openlit_data:

networks:
  tracing:
    name: tracing
    driver: bridge
